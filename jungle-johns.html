:root { --ink: #2a1d22; --panel: #163a22; --panel2: #1f5230; --gold: #f2c81c; --cream: #fff4d6; --money: #ffe14d; --bad: #ff6a5a; --warn: #ffb84a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a12; }
body { font-family: VT323, 'Courier New', monospace; color: var(--cream); font-size: 22px; user-select: none; -webkit-user-select: none; touch-action: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
.px { background: var(--panel); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--ink); padding: 8px 14px; }
body.inmenu #touch { display: none !important; }
body.inmenu #problems, body.inmenu #hint, body.inmenu #toasts, body.inmenu #prompt { visibility: hidden; }
#hud { display: none; position: fixed; inset: 0; pointer-events: none; }
#clockbox { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); min-width: 230px; line-height: 1; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; pointer-events: auto; }
#clockbtn { padding: 0; background: none; box-shadow: none; width: 56px; height: 56px; }
#clockbtn:hover { background: none; transform: scale(1.06); }
#clockface { width: 52px; height: 52px; image-rendering: pixelated; display: block; }
#h-day { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--gold); margin-bottom: 6px; }
#h-goal { font-size: 22px; margin-bottom: 4px; }
#h-gbar { height: 8px; background: var(--ink); position: relative; margin-bottom: 5px; }
#h-gbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #7dd35a; }
#nextday { grid-column: 1 / -1; display: none; font-size: 20px; padding: 4px 10px; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); filter: brightness(1.15); } }
#qbtn { pointer-events: auto; font-size: 20px; padding: 4px 12px; position: relative; }
#qbtn .kk { color: var(--gold); font-size: 16px; } #qbadge .rdy { color: var(--ink); background: var(--money); padding: 0 4px; margin-left: 6px; } #qbadge .off { color: var(--money); margin-left: 6px; }
.qrow { display: grid; grid-template-columns: 34px 1fr; gap: 8px; margin: 8px 0; text-align: left; line-height: 1.15; }
.qm { font-family: 'Press Start 2P', monospace; font-size: 20px; color: var(--money); text-shadow: 2px 2px 0 var(--ink); text-align: center; } .qm.grey { color: #b9c0c8; } .qm.done { color: #7dd35a; font-family: VT323, monospace; }
.qbar { height: 10px; background: var(--ink); margin: 6px 0; } .qbar i { display: block; height: 100%; background: var(--money); }
h2.big { font-size: 22px; color: var(--money); text-shadow: 3px 3px 0 var(--ink); animation: pulse 1.1s ease-in-out infinite; }
#h-wx { font-size: 20px; opacity: .9; }
#h-ev { color: #ff9ad0; font-size: 20px; }
#h-ev:empty { display: none; }
#moneybox { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); text-align: right; min-width: 200px; line-height: 1; }
#h-money { font-family: 'Press Start 2P', monospace; font-size: 18px; color: var(--money); margin-bottom: 6px; }
#h-stars { color: var(--gold); font-size: 26px; letter-spacing: 2px; }
#h-stars .dim { color: #4a5a40; }
#h-energy { margin-top: 6px; height: 10px; background: var(--ink); position: relative; }
#h-energy i { position: absolute; left: 0; top: 0; bottom: 0; background: #7dd35a; }
#h-elab { font-size: 16px; opacity: .8; margin-top: 6px; text-align: left; }
#problems { position: absolute; right: max(14px, env(safe-area-inset-right)); top: 128px; max-width: 300px; font-size: 19px; line-height: 1.15; background: rgba(22,58,34,.88); }
#problems .bad { color: var(--bad); } #problems .warn { color: var(--warn); } #problems .q { color: var(--money); }
#toolbar { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; pointer-events: auto; }
#tools { display: flex; gap: 6px; }
.tool { width: 52px; height: 52px; background: var(--panel); box-shadow: 0 0 0 3px var(--ink); position: relative; display: grid; place-items: center; cursor: pointer; }
.tool img { width: 36px; height: 36px; image-rendering: pixelated; }
.tool .k { position: absolute; left: 3px; top: 1px; font-size: 16px; color: var(--gold); }
.tool.on { background: var(--panel2); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 3px var(--gold); transform: translateY(-4px); }
#h-tool { font-size: 20px; text-shadow: 2px 2px 0 var(--ink); }
#h-tool small { font-size: 17px; color: var(--money); }
#prompt { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 22px; max-width: min(640px, 60vw); text-align: center; background: rgba(42,29,34,.9); box-shadow: 0 0 0 3px var(--ink); padding: 6px 14px; display: none; }
#prompt b { font-weight: normal; color: var(--cream); }
#hint { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); max-width: min(560px, 46vw); font-size: 21px; line-height: 1.15; background: #fff4b0; color: var(--ink); box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px rgba(0,0,0,.3); padding: 8px 12px; display: none; }
#toasts { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 170px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
.toast { background: rgba(22,58,34,.92); box-shadow: 0 0 0 3px var(--ink); padding: 4px 10px; font-size: 19px; line-height: 1.1; }
.toast.warn { background: rgba(120,40,20,.92); } .toast.good { background: rgba(30,90,120,.92); }

// shelf (16x24 incl. 8px overhang) for item categories
const SHELF_STYLE = {
  grocery: ['#9aa3ad', '#59606a'], asia: ['#b8452b', '#6a2a1a'], europe: ['#8a6a44', '#4a3826'], americas: ['#d07a2a', '#6a3a12'], mideast: ['#5a7a5a', '#2e402e'],

  natural: ['#8aa86a', '#4a6a34'], pets: ['#9aa3ad', '#59606a'], cookware: ['#9aa3ad', '#4e545e'], toys: ['#f0a030', '#8a4a10'], cards: ['#3a4aa8', '#1e2a6a'], viral: ['#2a2a38', '#121218'],

function shelfSprite(art, seed, fill) {
  const lv = Math.round(fill * 6), sv = seed % 6;
  return spr(`sh_${art}_${sv}_${lv}`, 16, 24, g => {
    const [frame, back] = SHELF_STYLE[art] || SHELF_STYLE.grocery;
    const r = mkRng(sv * 977 + art.length * 31);
    P(g, 0, 0, 16, 24, frame); P(g, 1, 2, 14, 21, back);
    P(g, 0, 0, 16, 2, shade(frame, 0.3)); P(g, 0, 0, 16, 1, shade(frame, 0.5));
    // tiers
    const wineish = art === 'wine' || art === 'hotsauce';
    const tiers = [2, 9, 16]; const tierH = 6;
    tiers.forEach(ty => { P(g, 1, ty + tierH, 14, 1, shade(frame, -0.2)); P(g, 1, ty + tierH, 14, 1, shade(frame, 0.15)); });
    const slots = []; tiers.forEach(ty => { if (wineish) { for (let i = 0; i < 5; i++) slots.push([1 + i * 3, ty]); } else { [1, 6, 11].forEach(sx => slots.push([sx, ty])); } });
    const order = slots.map((s, i) => [r(), i]).sort((a, b) => a[0] - b[0]).map(a => a[1]);
    const show = Math.round(slots.length * lv / 6); const shown = new Set(order.slice(0, show));
    slots.forEach((s, i) => { const tier = tiers.indexOf(s[1]); const ir = mkRng(sv * 131 + tier * 17 + art.length * 7); if (shown.has(i)) { if (wineish) { if (art === 'wine') IT.wine(g, s[0], s[1] - 1, pick(ir, ['#2c4a28', '#5a1626', '#3a2a18', '#c8b458', '#6a1a30']), pick(ir, ['#8a1a2a', '#c8a030', '#1a1a1a', '#e0e0e0'])); else IT.sauce(g, s[0], s[1] + 1, pick(ir, ['#d42a1a', '#ff7a1a', '#3aa83a', '#f2c21c', '#8a1a12']), pick(ir, ['#222', '#fff', '#2a8a2a'])); } else drawItem(g, art, s[0], s[1], ir); } });
    // price strips
    tiers.forEach(ty => { P(g, 1, ty + tierH, 14, 1, shade(frame, 0.25)); (wineish ? [2, 8, 13] : [2, 7, 12]).forEach(x => P(g, x, ty + tierH, 2, 1, '#f4f0e0')); });
    P(g, 0, 22, 16, 2, shade(frame, -0.35)); P(g, 0, 2, 1, 21, shade(frame, -0.15)); P(g, 15, 2, 1, 21, shade(frame, -0.3));
    if (lv === 0) { P(g, 5, 10, 6, 3, '#fff'); P(g, 6, 11, 4, 1, '#e23a2e'); }
  });
}

const GLYPH = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111',
  J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '1000111011101011000110001', N: '10011101101110011001', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101',
  S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '1000110001101011101110001', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',
  0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110', 4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001110',
  ' ': '000000000000000', '.': '000000000000010', ',': '000000000010100', ':': '000010000010000', '!': '010010010000010', '?': '110001010000010', "'": '010010000000000', '&': '010101010101011', '-': '000000111000000',
  '+': '000010111010000', '$': '011110010011110', '/': '001001010100100', '%': '101001010100101', '(': '010100100100010', ')': '010001001001010', '#': '101111101111101',

function glyphW(ch) { const g = GLYPH[ch] || GLYPH['?']; return g.length / 5; }
function pxTextW(s) { s = s.toUpperCase(); let w = 0; for (const ch of s) w += glyphW(ch) + 1; return Math.max(0, w - 1); }
function pxText(g, s, x, y, col) { s = s.toUpperCase(); g.fillStyle = col; for (const ch of s) { const gl = GLYPH[ch] || GLYPH['?'], w = gl.length / 5; for (let r = 0; r < 5; r++) for (let c = 0; c < w; c++) if (gl[r * w + c] === '1') g.fillRect(x + c, y + r, 1, 1); x += w + 1; } }

  const sub = 1;
  for (let i = 0; i < sub; i++) {
    updateDay(dt); if (RT.menu === 'report') break; updatePlayer(dt); updateFun(dt); updatePeople(dt); updateLater(dt); updateStaffTalk(dt); updateStory(dt); maybeFavor(dt);
    for (let k = RT.custs.length - 1; k >= 0; k--) { const c = RT.custs[k]; if (c) updateCust(c, dt); }
    updateLanes(dt); updateStaff(dt); updateCars(dt);
    if (RT.elvisT > 0) { RT.elvisT -= dt; if (Math.random() < dt * 4) RT.parts.push({ x: W.spots.elvis[0] * T + (Math.random() - 0.5) * 20, y: (W.spots.elvis[1] - 3) * T, vx: (Math.random() - 0.5) * 20, vy: -25, t: 1.4, note: true, c: pick(Math.random, ['#ffe14d', '#ff8fc0', '#9ff0ff']) }); }

function acceptQuest(q) {

// progress from anything the player does. type + optional dept/info
function questEvent(type, dept) {

// ---- handing out samples / asking questions ----
function custZone(c) { const [tx, ty] = custTile(c); const zi = inb(tx, ty) ? W.zone[idx(tx, ty)] : -1; return zi >= 0 ? DEPTS[zi].id : null; }
function canSample(c, q) {
  if (q.state !== 'active' || !['sample', 'talk'].includes(q.def.type) || (c.sampled && c.sampled[q.key])) return false;
  if (q.def.kids ? c.type !== 'kid' : c.type === 'kid') return false;
  if (['follow', 'exitOut', 'lost'].includes(c.state) || c.then === 'exit') return false;
  return q.def.zones.includes(custZone(c));
}
function sampleQuestFor(c) { return (RT.quests || []).find(q => canSample(c, q)) || null; }
function giveSample(c, q) {
  c.sampled = c.sampled || {}; c.sampled[q.key] = 1; moodHit(c, 6); bubble(c, pick(Math.random, SAMPLE_LINES[q.def.lines] || ['thanks!']), 3.5);
  floatText(c.x, c.y - 30, `${q.got + 1}/${q.n}`, '#ffe14d'); sfx('pick'); RT.parts.push({ x: c.x, y: c.y - 30, vx: 0, vy: -18, t: 0.9, note: true, c: '#ff8fc0' });
  const who = c.parent || c; if (who.hold === q) who.hold = null; // let them go shop
  if (q.def.buy && who.list && DEPT[q.def.buy] && deptOpen(DEPT[q.def.buy]) && !who.list.includes(q.def.buy) && Math.random() < 0.7) who.list.unshift(q.def.buy);

// ---- keeping the right crowd in each quest zone ----
function zoneTiles(id) { // walkable floor in a department, cached per world build
  if (W.ztCache !== W.groundCanvas) { W.ztCache = W.groundCanvas; W.zt = {}; }
  if (!W.zt[id]) { const i = DEPTS.findIndex(d => d.id === id), out = []; if (i >= 0) for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { const k = idx(x, y); if (W.zone[k] === i && !W.solid[k] && !W.objAt.get(k) && W.cost[k] < 10) out.push([x, y]); } W.zt[id] = out; }
  return W.zt[id];
}
function randomZoneTile(zones) { const open = zones.filter(z => DEPT[z] && deptOpen(DEPT[z]) && zoneTiles(z).length); if (!open.length) return null; return pick(Math.random, zoneTiles(pick(Math.random, open))); }
function goLoiter(c, zones) { const t = randomZoneTile(zones); if (!t) return false; c.state = 'walk'; c.then = 'loiter'; goTo(c, t[0] + 0.3 + Math.random() * 0.4, t[1] + 0.6 + Math.random() * 0.2); return true; }
const FREE_STATES = ['walk', 'browse', 'toStore', 'loiter', 'elvis', 'waitLane'];
function isFree(c) { return c.type !== 'kid' && !c.hold && FREE_STATES.includes(c.state) && c.then !== 'exit' && c.then !== 'sit' && !c.lane; }
// every second: each quest that needs people in a zone keeps enough of them there (up to 10 for an accepted job,
// a few for one on offer so the zone looks alive). they come from the crowd first, then from new arrivals.
function questCrowd(dt) {
  RT.crowdT = (RT.crowdT || 0) - dt; if (RT.crowdT > 0 || ST.phase !== 'day') return; RT.crowdT = 1;
  for (const q of RT.quests || []) {
    const t = q.def.type; if (q.state === 'done' || q.state === 'ready') continue;
    if (t === 'pour') { if (q.state === 'active') seatTasters(q); continue; }
    if (t === 'elvis' && q.state === 'active') { keepKids(q, ['candy'], 3); continue; }
    if (t !== 'sample' && t !== 'talk') continue;
    const want = q.state === 'active' ? Math.min(q.n - q.got, 10) : 3;
    if (q.def.kids) { keepKids(q, q.def.zones, want); continue; }
    let have = RT.custs.filter(c => c.type !== 'kid' && !(c.sampled && c.sampled[q.key]) && (c.hold === q || q.def.zones.includes(custZone(c)))).length;
    if (have >= want) continue;
    const z = DEPT[q.def.zones[0]], zx = (z.x + z.w / 2) * T, zy = (z.y + z.h / 2) * T;
    const cands = RT.custs.filter(c => isFree(c) && !(c.sampled && c.sampled[q.key])).sort((a, b) => Math.hypot(a.x - zx, a.y - zy) - Math.hypot(b.x - zx, b.y - zy));
    while (have < want && cands.length) { const c = cands.shift(); c.hold = q; c.holdZones = q.def.zones; goLoiter(c, q.def.zones); have++; }
    for (let i = 0; i < Math.min(want - have, 2) && RT.custs.length < MAX_CUSTS; i++) { const c = spawnCustomer(); if (c) { c.hold = q; c.holdZones = q.def.zones; } }
  }
}
function keepKids(q, zones, want) { // families: hold the parent, the kid tags along
  const kids = RT.custs.filter(c => c.type === 'kid' && c.parent && !(c.sampled && c.sampled[q.key]));
  let have = kids.filter(k => k.parent.hold === q || zones.includes(custZone(k))).length; if (have >= want) return;
  const z = DEPT[zones[0]], zx = (z.x + z.w / 2) * T, zy = (z.y + z.h / 2) * T;
  const cands = kids.map(k => k.parent).filter(p => isFree(p)).sort((a, b) => Math.hypot(a.x - zx, a.y - zy) - Math.hypot(b.x - zx, b.y - zy));
  while (have < want && cands.length) { const p = cands.shift(); p.hold = q; p.holdZones = zones; goLoiter(p, zones); have++; }
  for (let i = 0; i < Math.min(want - have, 2) && RT.custs.length < MAX_CUSTS; i++) { const p = spawnCustomer('adult', true); if (p) { p.hold = q; p.holdZones = zones; } }
}
function seatTasters(q) { // keep the tasting stools filled while the pour job is on
  const free = W.stools.filter(s => !s.cust); if (!free.length) return;
  const cands = RT.custs.filter(c => isFree(c)).sort((a, b) => Math.hypot(a.x - free[0].x * T, a.y - free[0].y * T) - Math.hypot(b.x - free[0].x * T, b.y - free[0].y * T));
  for (const s of free) { let c = cands.shift(); if (!c) { if (RT.custs.length >= MAX_CUSTS) return; c = spawnCustomer(); if (!c) return; } s.cust = c; c.stool = s; c.tasted = true; c.state = 'walk'; c.then = 'sit'; goTo(c, s.x + 0.5, s.y + 0.75); }
}
// quests that need something broken or spilled get it
function questTrouble(dt) {
  RT.troubleT = (RT.troubleT || 0) - dt; if (RT.troubleT > 0 || ST.phase !== 'day') return; RT.troubleT = 6;
  for (const q of RT.quests || []) {
    if (q.state !== 'active') continue; const left = q.n - q.got;
    if (q.def.type === 'mop' && RT.spills.length < Math.min(left, 3)) { const c = pick(Math.random, RT.custs.filter(c => c.type !== 'kid' && !custOutside(c))); if (c) makeSpill(c); }
    if (q.def.type === 'fix') { const ks = Object.keys(ANIMS).filter(k => W.anims[k] && ST.anims[k]); if (!ks.some(k => ST.anims[k].broken)) { const k = pick(Math.random, ks); if (k) { ST.anims[k].broken = true; ST.anims[k].fix = 0; toast(`${ANIMS[k].name[0].toUpperCase() + ANIMS[k].name.slice(1)} broke down. Bring the wrench.`, 'warn'); } } }
    if (q.def.type === 'help' && !RT.custs.some(c => c.state === 'lost')) { const c = pick(Math.random, RT.custs.filter(c => c.type !== 'kid' && c.state === 'browse' && c.list.length)); if (c) makeLost(c); }
  }
}
function custOutside(c) { const [tx, ty] = custTile(c); return !inb(tx, ty) || W.outdoor[idx(tx, ty)]; }

function updateFun(dt) {

  if (RT.beesT > 0) { RT.beesT -= dt; for (let i = 0; i < 2; i++) { const a = Math.random() * 6.283, r = 10 + Math.random() * 10; RT.parts.push({ x: PL.x + Math.cos(a) * r, y: PL.y - 12 + Math.sin(a) * r * 0.6, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 40, t: 0.25, c: Math.random() < 0.5 ? '#ffd23f' : '#2a2a2a' }); }
    if (RT.beesT <= 0) { flash('the bees lost interest. you survived.'); foundSecret('bees'); } }
  if (PL.spinT > 0) { PL.spinT = Math.max(0, PL.spinT - dt); PL.dir = ['down', 'left', 'up', 'right'][Math.floor(PL.spinT * 12) % 4]; }
  // laps around the jungle scene: the angle around the pond adds up while you stay near it and keep moving
  const pond = W.objs.find(o => o.type === 'pond');
  if (pond && !RT.room && !PL.walk) { const cx = (pond.x + pond.w / 2) * T, cy = (pond.y + pond.h / 2) * T, d = Math.hypot(PL.x - cx, PL.y - cy), a = Math.atan2(PL.y - cy, PL.x - cx);
    if (d < 5.5 * T && Math.hypot(PL.vx, PL.vy) > 20) { if (RT.fun.orbitA !== null) { let da = a - RT.fun.orbitA; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI; RT.fun.orbit += da;
        const laps = Math.floor(Math.abs(RT.fun.orbit) / (2 * Math.PI)); if (laps > (RT.fun.lapShown || 0)) { RT.fun.lapShown = laps; floatText(PL.x, PL.y - 34, `lap ${laps}`, '#ffe14d'); if (laps >= 5) foundSecret('orbit'); } }
      RT.fun.orbitA = a; } else { RT.fun.orbitA = null; RT.fun.orbit = 0; RT.fun.lapShown = 0; } }

// ---------- state ----------
function S() { if (!ST.story) ST.story = { ch: 0, step: 0, dayStarted: 0, done: false }; if (!ST.heist) ST.heist = { state: 'off', step: 0, day: 0 }; return ST.story; }
function mainChapter() { const s = S(); return s.done ? null : MAIN[s.ch]; }
function activeLines() { // [line id, chapter, step index] for everything running today
  const out = [], s = S(), h = ST.heist; const c = mainChapter(); if (c && s.dayStarted === ST.day) out.push(['main', c, s.step]);
  if (h.state === 'missing') out.push(['heist', HEIST, h.step]); return out;
}
function curStep(line) { if (line === 'main') { const c = mainChapter(); return c && S().dayStarted === ST.day ? c.steps[S().step] : null; } if (line === 'heist' && ST.heist.state === 'missing') return HEIST.steps[ST.heist.step]; return null; }
// called from startDay: today's chapter begins (the huddle plays once the day is on screen), the heist moves on
function storyStartDay() {
  const s = S(), h = ST.heist; RT.snpcs = []; RT.clues = []; RT.storyBits = { insp: null, chase: null };
  if (!s.done && s.dayStarted !== ST.day) { if (s.dayStarted && s.step >= MAIN[s.ch].steps.length) { s.ch++; s.step = 0; } if (s.ch >= MAIN.length) s.done = true; else { s.dayStarted = ST.day; RT.huddle = 'main'; } }
  if (h.state === 'hint' && ST.day > h.day) { h.state = 'missing'; h.step = 0; RT.huddleHeist = true; }
  for (const [line] of activeLines()) setupStep(line);
}
function chapterDone(line) { if (line === 'main') return S().step >= MAIN[S().ch].steps.length; return ST.heist.state === 'done'; }
function advance(line) {
  if (line === 'main') { const s = S(); s.step++; const c = MAIN[s.ch]; if (s.step >= c.steps.length) { toast(`Chapter ${s.ch + 1} done: ${c.title}.`, 'good'); MUSIC.sting('good'); if (c.ending) playScene(c.ending, () => { s.done = true; toast('The store is yours. Thanks for playing the story. The store keeps going.', 'good'); }); if (s.ch === MAIN.length - 1 && !c.ending) s.done = true; } else setupStep('main'); }
  else { const h = ST.heist; h.step++; if (h.step >= HEIST.steps.length) { h.state = 'done'; toast('Side quest done: The Big Cheese Heist.', 'good'); } else setupStep('heist'); }
  sfx('good'); saveMid();
}

function zoneSpot(zone) { // a floor tile in the zone you can stand next to (clues can't hide between shelves)

function catalogHTML() {

    let btn = own ? '<button disabled>Owned</button>' : needReq ? `<button disabled>Needs ${UPG[u.req].name}</button>` : needStars ? `<button disabled>Needs ${'★'.repeat(u.stars)}</button>` : broke ? `<button disabled>${fmtMoney(u.cost)}</button>` : `<button data-buy="${u.id}" class="buy">Buy ${fmtMoney(u.cost)}</button>`;
    return `<div class="card ${own ? 'own' : ''}"><div class="cn">${typo(u.name)}</div><div class="cd">${typo(u.desc)}${u.wage ? ` Wage ${fmtMoney(u.wage)}/day.` : ''}</div>${btn}</div>`;
  }).join('');
  return `<h2>Catalog</h2><div class="sub">You have <b class="money">${fmtMoney(ST.money)}</b> and ${'★'.repeat(stars())} rep</div>
  <div class="tabs">${cats.map(([k, n]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div><div class="cards">${items}</div>
  <div class="row"><button id="m-close">Done</button></div>`;
}
function reportHTML() {
  const r = RT.report; const net = r.sales + r.tips + r.extra + r.quest - r.wholesale - r.wages; const avg = r.moods.length ? r.moods.reduce((a, b) => a + b, 0) / r.moods.length : 0;

  <p>Goal ${fmtMoney(r.goal)}. You made <b class="money">${fmtMoney(r.earned)}</b>.</p>
  <table class="rep">

function clockFace(night) { // 26x26 dial, sun or moon in the middle

    disc(g, 13, 13, 12.5, '#2a1d22'); disc(g, 13, 13, 11.5, '#fff4d6'); disc(g, 13, 13, 9, night ? '#1c2f86' : '#7fd4ff');
    [[12, 2], [12, 22], [2, 12], [22, 12]].forEach(([x, y]) => P(g, x, y, 2, 2, '#2a1d22'));
    if (night) { disc(g, 13, 13, 5, '#fff4b0'); disc(g, 15.5, 11, 4.4, '#1c2f86'); P(g, 7, 8, 1, 1, '#ffffff'); P(g, 18, 17, 1, 1, '#ffffff'); P(g, 17, 7, 1, 1, '#fff4b0'); }
    else { for (let a = 0; a < 8; a++) { const x = 13 + Math.cos(a * Math.PI / 4) * 6.5, y = 13 + Math.sin(a * Math.PI / 4) * 6.5; P(g, Math.round(x - 0.5), Math.round(y - 0.5), 1, 1, '#ff9a1a'); } disc(g, 13, 13, 4.5, '#ffd23f'); disc(g, 12, 12, 2, '#fff09a'); }
  });
}
function wizHatSprite() { // original pixel wizard hat for the title
  return spr('wizhat', 40, 46, g => {
    g.translate(2, 2);
    for (let y = 0; y <= 31; y++) { const w = Math.round(2 + y * 0.8), cx = 18 + (y < 10 ? (10 - y) * 0.7 : 0) - (31 - y) * 0.05, x0 = Math.round(cx - w / 2);
      P(g, x0, y, w, 1, '#2a4ab8'); P(g, x0, y, Math.max(1, Math.round(w * 0.3)), 1, '#3e66e0'); P(g, x0 + w - Math.max(1, Math.round(w * 0.22)), y, Math.max(1, Math.round(w * 0.22)), 1, '#1c2f86'); }

    P(g, 12, 16, 1, 1, '#ffd84a'); P(g, 25, 21, 1, 1, '#ffd84a'); P(g, 8, 28, 1, 1, '#ffd84a'); P(g, 19, 10, 1, 1, '#fff6c0');

}

  <div class="col tbtn">${hasSave() ? '<button id="t-cont" class="buy">Continue</button>' : ''}<button id="t-new" class="${hasSave() ? '' : 'buy'}">New game</button></div>

function drawMap() {

// ===== main =====

  auInit(); musicStart();
  if (!(cont && load())) { newState(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
  AU.musicOn = ST.settings.music; AU.sfxOn = ST.settings.sfx;

  if (resumed) toast(`Back to ${weekday()}, week ${weekNo()}. ${fmtMoney(earnedToday())} of ${fmtMoney(dayGoal())} made so far.`);
  else if (!cont || ST.day === 1) showDialog(CONFIG.cashierName, `morning boss. we need ${fmtMoney(dayGoal())} today. everybody with a yellow ! over their head has a job for you, and every job pays. make the money, then close up by the clock. monday to friday. go get 'em.`, null, 'J opens the quest log. The stock room is behind the bakery.');
  else toast(`Welcome back. ${weekday()}, week ${weekNo()}. Goal today: ${fmtMoney(dayGoal())}.`);

const VK = { x: 0, y: 0 };
function bindInput() {
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();

    KEYS[e.code] = true;
    if (RT.menu === 'title') { if (e.code === 'Enter' || e.code === 'Space') { const b = document.querySelector('#menu .buy'); if (b) b.click(); } return; }
    if (RT.dialog) { if (e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter') advanceDialog(); if (RT.dialog && RT.dialog.choices && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD')) { const n = RT.dialog.choices.length; RT.dialog.sel = (RT.dialog.sel + (e.code.endsWith('Left') || e.code === 'KeyA' ? n - 1 : 1)) % n; [...$('#dl-choices').children].forEach((b, i) => b.classList.toggle('sel', i === RT.dialog.sel)); } return; }
    if (e.code === 'Escape') { if (RT.menu === 'report') return; if (RT.menu) closeMenu(); else openMenu('pause'); return; }
    if (e.code === 'KeyM') { if (RT.menu === 'map') closeMenu(); else if (!RT.menu) openMenu('map'); return; }
    if (e.code === 'KeyJ' || e.code === 'KeyL') { if (RT.menu === 'quests') closeMenu(); else if (!RT.menu) openMenu('quests'); return; }
    if (RT.menu) { if ((e.code === 'Enter' || e.code === 'Space') && RT.menu === 'report') { const b = document.getElementById('m-next'); if (b) b.click(); } return; }
    if (e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter') doAction();
    if (e.code >= 'Digit1' && e.code <= 'Digit4') PL.tool = +e.code.slice(5) - 1;
    if (e.code === 'KeyQ' || e.code === 'Tab') PL.tool = (PL.tool + 1) % TOOLS.length;
    if (e.code === 'KeyR') toggleSkates();
  });
  addEventListener('keyup', e => { KEYS[e.code] = false; });
  addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
  addEventListener('resize', resize);
  addEventListener('pagehide', saveMid); document.addEventListener('visibilitychange', () => { if (document.hidden) saveMid(); });
  // touch

    $('#touch').style.display = 'block'; const pad = $('#t-pad'), knob = $('#t-knob'); let id = null, ox = 0, oy = 0;
    const setK = () => { KEYS.KeyA = VK.x < -0.35; KEYS.KeyD = VK.x > 0.35; KEYS.KeyW = VK.y < -0.35; KEYS.KeyS = VK.y > 0.35; };

    const up = () => { id = null; VK.x = VK.y = 0; knob.style.transform = ''; setK(); }; pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
    $('#t-a').addEventListener('pointerdown', e => { e.preventDefault(); if (RT.dialog) advanceDialog(); else if (!RT.menu) doAction(); });

    $('#t-skate').addEventListener('pointerdown', e => { e.preventDefault(); if (!RT.menu && !RT.dialog) { toggleSkates(); $('#t-skate').textContent = PL.walk ? 'SKATE' : 'WALK'; } });
    $('#t-menu').addEventListener('pointerdown', e => { e.preventDefault(); if (RT.menu && RT.menu !== 'report' && RT.menu !== 'title') closeMenu(); else if (!RT.menu) openMenu('pause'); });
  }
  $('#dialog').addEventListener('click', () => { if (RT.dialog && !RT.dialog.choices) advanceDialog(); });

let lastT = 0;
function frame(t) {
