:root { --ink: #2a1d22; --panel: #163a22; --panel2: #1f5230; --gold: #f2c81c; --cream: #fff4d6; --money: #ffe14d; --bad: #ff6a5a; --warn: #ffb84a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a12; }
body { font-family: VT323, 'Courier New', monospace; color: var(--cream); font-size: 22px; user-select: none; -webkit-user-select: none; touch-action: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
.px { background: var(--panel); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--ink); padding: 8px 14px; }
body.inmenu #touch { display: none !important; }
body.inmenu #problems, body.inmenu #hint, body.inmenu #toasts, body.inmenu #prompt { visibility: hidden; }
#hud { display: none; position: fixed; inset: 0; pointer-events: none; }
#clockbox { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); min-width: 190px; line-height: 1; }
#h-day { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--gold); margin-bottom: 6px; }
#h-time { font-family: 'Press Start 2P', monospace; font-size: 18px; margin-bottom: 6px; }
#h-wx { font-size: 20px; opacity: .9; }
#h-ev { color: #ff9ad0; font-size: 20px; }
#h-ev:empty { display: none; }
#moneybox { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); text-align: right; min-width: 200px; line-height: 1; }
#h-money { font-family: 'Press Start 2P', monospace; font-size: 18px; color: var(--money); margin-bottom: 6px; }
#h-stars { color: var(--gold); font-size: 26px; letter-spacing: 2px; }
#h-stars .dim { color: #4a5a40; }
#h-energy { margin-top: 6px; height: 10px; background: var(--ink); position: relative; }
#h-energy i { position: absolute; left: 0; top: 0; bottom: 0; background: #7dd35a; }
#h-elab { font-size: 16px; opacity: .8; margin-top: 6px; text-align: left; }
#problems { position: absolute; right: max(14px, env(safe-area-inset-right)); top: 128px; max-width: 300px; font-size: 19px; line-height: 1.15; background: rgba(22,58,34,.88); }
#problems .bad { color: var(--bad); } #problems .warn { color: var(--warn); } #problems .q { color: var(--money); }
#toolbar { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; pointer-events: auto; }
#tools { display: flex; gap: 6px; }
.tool { width: 52px; height: 52px; background: var(--panel); box-shadow: 0 0 0 3px var(--ink); position: relative; display: grid; place-items: center; cursor: pointer; }
.tool img { width: 36px; height: 36px; image-rendering: pixelated; }
.tool .k { position: absolute; left: 3px; top: 1px; font-size: 16px; color: var(--gold); }
.tool.on { background: var(--panel2); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 3px var(--gold); transform: translateY(-4px); }
#h-tool { font-size: 20px; text-shadow: 2px 2px 0 var(--ink); }
#h-tool small { font-size: 17px; color: var(--money); }
#prompt { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 22px; max-width: min(640px, 60vw); text-align: center; background: rgba(42,29,34,.9); box-shadow: 0 0 0 3px var(--ink); padding: 6px 14px; display: none; }
#prompt b { font-weight: normal; color: var(--cream); }
#hint { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); max-width: min(560px, 46vw); font-size: 21px; line-height: 1.15; background: #fff4b0; color: var(--ink); box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px rgba(0,0,0,.3); padding: 8px 12px; display: none; }
#toasts { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 132px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
.toast { background: rgba(22,58,34,.92); box-shadow: 0 0 0 3px var(--ink); padding: 4px 10px; font-size: 19px; line-height: 1.1; }
.toast.warn { background: rgba(120,40,20,.92); } .toast.good { background: rgba(30,90,120,.92); }
#dialog { display: none; position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(760px, 92vw); min-height: 120px; z-index: 5; cursor: pointer; }
#dl-name { font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--gold); margin-bottom: 8px; }
#dl-text { font-size: 25px; line-height: 1.15; min-height: 58px; }
.dsub { margin-top: 8px; color: var(--money); font-size: 21px; }
#dl-more { position: absolute; right: 16px; bottom: 8px; color: var(--gold); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#dl-choices { gap: 10px; margin-top: 10px; }
button { font-family: VT323, monospace; font-size: 22px; background: var(--panel2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--ink), inset 0 -3px 0 rgba(0,0,0,.3); padding: 6px 16px; cursor: pointer; }
button:hover:not(:disabled), button.sel { background: #2a6a3e; }
button:focus-visible { outline: 3px solid var(--money); outline-offset: 3px; }
button.buy { background: var(--gold); color: var(--ink); box-shadow: 0 0 0 3px var(--ink), inset 0 -3px 0 #b8900a; }
button.buy:hover { background: #ffe14d; }
button:disabled { opacity: .55; cursor: default; }
.menu { display: none; position: fixed; inset: 0; background: rgba(8,14,10,.7); z-index: 10; align-items: center; justify-content: center; }
.menu.title { background: radial-gradient(ellipse at center, rgba(8,14,10,.35), rgba(8,14,10,.85)); }
#menu-box { max-width: min(980px, 94vw);}
.menu.catalog #menu-box { width: min(980px, 94vw);}
#menu-box { max-height: 92vh; overflow: auto; }
.menu:not(.title) #menu-box { background: var(--panel); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--ink); padding: 18px 24px; }
#menu-box h2 { font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--gold); margin: 4px 0 12px; line-height: 1.4; }
#menu-box h3 { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--cream); margin: 14px 0 6px; }
#menu-box p { margin: 10px 0; line-height: 1.15; max-width: 64ch; }
.small { font-size: 19px; opacity: .85; }
.sub { margin-bottom: 10px; } .money { color: var(--money); font-weight: normal; } .stars { color: var(--gold); } .dim { opacity: .6; }
.row { display: flex; gap: 14px; justify-content: flex-end; margin-top: 14px; }
.col { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 320px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button.on { background: var(--gold); color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: #0f2c18; box-shadow: 0 0 0 3px var(--ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.own { opacity: .7; } .cn { color: var(--gold); font-size: 23px; } .cd { font-size: 19px; line-height: 1.1; flex: 1; }
table.rep { border-collapse: collapse; min-width: 380px; font-size: 22px; }
table.rep td { padding: 2px 0; } table.rep td:last-child { text-align: right; padding-left: 40px; }
table.rep .neg { color: var(--bad); } table.rep .pos { color: #7dff7a; } table.rep tr.tot td { border-top: 2px solid var(--gold); padding-top: 6px; }
.tasks div { font-size: 21px; line-height: 1.2; } .tasks .ok { color: #9dff8a; } .tasks .no { color: var(--bad); }
#mapc { display: block; box-shadow: 0 0 0 3px var(--ink); image-rendering: auto; }
/* title */
.menu.title #menu-box { text-align: center; padding: 24px; }
.tgir { width: 184px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
.menu.title h1 { font-family: 'Press Start 2P', monospace; font-size: clamp(26px, 5.2vw, 58px); color: #ffe14d; margin: 0; line-height: 1.15;
  text-shadow: 3px 3px 0 #1f7a32, 6px 6px 0 #1f7a32, 9px 9px 0 var(--ink); }
.tsub { display: inline-block; margin-top: 18px; background: #1f7a32; color: #fff; font-family: 'Press Start 2P', monospace; font-size: clamp(10px, 1.6vw, 16px); padding: 8px 14px; box-shadow: 0 0 0 3px var(--ink); }
.tblurb { margin: 18px auto !important; font-size: 24px; text-shadow: 2px 2px 0 var(--ink); }
.tbtn { width: 280px; margin: 0 auto; } .tbtn button { font-size: 26px; padding: 8px; }
.menu.title .small { text-shadow: 2px 2px 0 var(--ink); margin: 18px auto 0 !important; }
/* touch */
#touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 6; }
#t-pad { position: absolute; left: 24px; bottom: 96px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,244,214,.12); box-shadow: 0 0 0 3px rgba(42,29,34,.6); pointer-events: auto; touch-action: none; }
#t-knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(242,200,28,.7); }
#t-a, #t-tool, #t-menu { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; display: grid; place-items: center; font-family: 'Press Start 2P', monospace; color: var(--ink); box-shadow: 0 0 0 3px var(--ink); }
#t-a { right: 28px; bottom: 110px; width: 84px; height: 84px; background: var(--gold); font-size: 22px; }
#t-tool { right: 126px; bottom: 90px; width: 58px; height: 58px; background: var(--cream); font-size: 10px; }
#t-menu { right: 28px; top: 120px; width: 46px; height: 46px; background: var(--cream); font-size: 12px; }
@media (max-width: 760px) { #problems { top: auto; bottom: 230px; font-size: 17px; max-width: 220px; } #hint { max-width: 90vw; top: 118px; font-size: 18px; } body { font-size: 18px; } #toasts { top: 120px; max-width: 220px; } }

// ===== pixel art: everything is drawn at 1x into small canvases, then scaled =====
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mkRng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function P(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { const dx = x + 0.5 - cx, dy = y + 0.5 - cy; if (dx * dx + dy * dy <= r * r) g.fillRect(x, y, 1, 1); } }
function oval(g, cx, cy, rx, ry, c) { g.fillStyle = c; for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1); } }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function shade(h, amt) { const [r, g, b] = hex2rgb(h); const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt))); return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }
const OL = '#2a1d22';
// add 1px outline around opaque pixels
function outline(c, col = OL) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), a = d.data;
  const [r, gg, b] = hex2rgb(col); const op = i => a[i * 4 + 3] > 100; const mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x; if (op(i)) continue; if ((x > 0 && op(i - 1)) || (x < w - 1 && op(i + 1)) || (y > 0 && op(i - w)) || (y < h - 1 && op(i + w))) mark.push(i); }
  mark.forEach(i => { a[i * 4] = r; a[i * 4 + 1] = gg; a[i * 4 + 2] = b; a[i * 4 + 3] = 255; });
  g.putImageData(d, 0, 0); return c;
}
function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }

function checker(g, x0, y0, a, b, sz) { for (let y = 0; y < 16; y += sz) for (let x = 0; x < 16; x += sz) P(g, x0 + x, y0 + y, sz, sz, ((x + y) / sz) % 2 ? b : a); }

// ---------- staff AI ----------
function updateStaff(dt) {
  RT.staff.forEach(s => {
    if (s.kind === 'cashier') { s.anim = (s.anim || 0) + dt; s.dir = 'right'; s.frame = 0; return; }
    if (s.state === 'walk') { if (stepPath(s, dt, 46)) s.onArrive && s.onArrive(); return; }
    if (s.state === 'work') { s.timer -= dt; s.frame = 0; if (s.timer <= 0) { s.state = 'idle'; s.timer = 1; s.done && s.done(); } return; }
    s.timer -= dt * minPerSec(); s.frame = 0; if (s.timer > 0) return;
    if (s.kind === 'stocker') {
      if (!isOpen() && ST.minute > CLOSE_MIN) { s.timer = 999; return; }
      const cands = DEPTS.filter(d => d.max && d.crate && deptOpen(d) && fill(d.id) < 0.7 && !RT.staff.some(o => o !== s && o.target === d.id)).sort((a, b) => fill(a.id) - fill(b.id));
      if (!cands.length) { s.timer = 20; return; }
      const d = cands[0]; s.target = d.id; const pal = W.pallets.find(p => p.crate === d.crate); if (!pal) { s.timer = 20; return; }
      s.state = 'walk'; goTo(s, pal.x + 0.5, pal.y + 1.75);
      s.onArrive = () => { const cost = crateCost(d.crate); if (ST.money < cost) { s.state = 'idle'; s.timer = 30; s.target = null; return; } ST.money -= cost; RT.day.wholesale += cost; s.carry = d.crate; const f = pick(Math.random, W.fronts[d.id]); s.state = 'walk'; goTo(s, f[0] + 0.5, f[1] + 0.75); s.onArrive = () => { s.state = 'work'; s.timer = 1.2; s.done = () => { ST.stock[d.id] = Math.min(d.max, ST.stock[d.id] + CRATES[d.crate].units); s.carry = null; s.target = null; s.timer = 75; }; }; };
    } else if (s.kind === 'janitor') {
      const free = RT.spills.filter(p => !RT.staff.some(o => o.target === p)); if (!free.length) { s.timer = 6; return; }
      free.sort((a, b) => Math.hypot(a.x * T - s.x, a.y * T - s.y) - Math.hypot(b.x * T - s.x, b.y * T - s.y)); const sp = free[0]; s.target = sp; s.state = 'walk'; goTo(s, sp.x + 0.5, sp.y + 0.75);
      s.onArrive = () => { s.state = 'work'; s.timer = 2.2; s.done = () => { const i = RT.spills.indexOf(sp); if (i >= 0) RT.spills.splice(i, 1); s.target = null; s.timer = 10; }; };
    } else if (s.kind === 'tech') {
      const k = Object.keys(ANIMS).find(k => W.anims[k] && ST.anims[k].broken); if (!k) { s.timer = 10; return; }
      const o = W.objs.find(o => o.anim === k); const f = [o.x + 0.5, o.y + o.h + 0.75]; s.state = 'walk'; goTo(s, f[0], f[1]);
      s.onArrive = () => { s.state = 'work'; s.timer = 3.5; s.done = () => { ST.anims[k].broken = false; ST.anims[k].fix = 0; s.timer = 20; }; };
    }
  });
}

// ---------- cars ----------
function updateCars(dt) {

const KEYS = {};
function playerFacing() {

  PL.period = SK.period;

  const s2 = Math.hypot(PL.vx, PL.vy); PL.anim += s2 * dt; PL.frame = 0; PL.bumpT -= dt;

  const tx = Math.floor(PL.x / T), ty = Math.floor((PL.y - 3) / T); PL.onCash = W.lanes.find(l => !l.staff && l.cash[0] === tx && l.cash[1] === ty) || null;

}
function hitAt(x, y) { const hw = 4.5, hh = 3; for (const [px, py] of [[x - hw, y - hh], [x + hw, y - hh], [x - hw, y], [x + hw, y]]) { const tx = Math.floor(px / T), ty = Math.floor(py / T); if (isSolid(tx, ty)) return true; } return false; }
function moveAxis(dx, dy) {
  if (!dx && !dy) return; const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2); const sx = dx / steps, sy = dy / steps;

}
let flashMsg = null; function flash(t) { flashMsg = { text: say(t), t: 2.2 }; }

// what's in front of the player + what Space would do
function targetInfo() {
  const f = playerFacing(); const tool = TOOLS[PL.tool].id;
  // customers first
  let best = null, bd = 14;
  for (const c of RT.custs) { const d = Math.hypot(c.x - f.px, c.y - 4 - f.py); if (d < bd) { bd = d; best = c; } }
  for (const s of RT.staff) { const d = Math.hypot(s.x - f.px, s.y - 4 - f.py); if (d < bd) { bd = d; best = s; } }
  const o = inb(f.tx, f.ty) ? W.objAt.get(idx(f.tx, f.ty)) : null;
  const spill = RT.spills.find(s => (s.x === f.tx && s.y === f.ty) || (s.x === Math.floor(PL.x / T) && s.y === Math.floor((PL.y - 3) / T)));
  if (PL.onCash && tool === 'hands') { const c = PL.onCash.queue[0]; return { act: 'scan', label: c && c.qi === 0 ? `Space: scan item (${c.scanned}/${c.items})` : 'Waiting for a customer' }; }
  if (tool === 'mop' && spill) return { act: 'mop', spill, label: 'Space: mop the spill' };
  if (best && best.kind) return { act: 'talkStaff', s: best, label: `Space: talk to ${best.name}` };
  if (best && (tool === 'hands' || best.state === 'lost')) {
    if (best.state === 'lost') return { act: 'help', c: best, label: 'Space: help this lost customer' };
    if (best.state === 'sit' && !best.poured) return { act: 'pour', c: best, label: 'Space: pour a tasting ($5)' };
    return { act: 'talk', c: best, label: 'Space: talk' };
  }
  if (best && best.kind) return { act: 'talkStaff', s: best, label: `Space: talk to ${best.name}` };
  if (!o) return spill && tool !== 'mop' ? { label: 'Spill here. Switch to the mop (2).' } : null;
  const dept = o.dept ? DEPT[o.dept] : null;
  if (o.type === 'pallet') { const cost = crateCost(o.crate); if (tool !== 'hands') return { label: 'Switch to hands (1) to grab crates' }; if (PL.carry.length && PL.carry[PL.carry.length - 1] === o.crate) return { act: 'return', o, label: `Space: put back ${CRATES[o.crate].name} crate (refund)` }; if (PL.carry.length >= carryCap()) return { label: `Hands full (${carryCap()} max)` }; return { act: 'grab', o, label: `Space: grab ${CRATES[o.crate].name} crate (${fmtMoney(cost)})` }; }
  if (dept && dept.max) {
    const lbl = `${dept.name}: ${ST.stock[dept.id]}/${dept.max}`;
    if (PL.carry.length) { const i = PL.carry.indexOf(dept.crate); if (i >= 0) return { act: 'stock', o, dept, i, label: `Space: restock ${dept.name} (${ST.stock[dept.id]}/${dept.max})` }; return { label: `${lbl}. Needs a ${CRATES[dept.crate].name} crate.` }; }
    if (o.type === 'tank') { if (tool === 'food') return { act: 'feed', o, label: ST.fedToday ? 'Fish are full' : 'Space: feed the tanks' }; return { label: ST.fedToday ? 'Live tanks (fed)' : 'Live tanks are hungry. Fish food is tool 4.' }; }
    if (o.type === 'bigcheese') return cheeseInfo(tool);
    if (o.anim && ST.anims[o.anim] && ST.anims[o.anim].broken) return animInfo(o, tool);
    return { label: lbl + (ST.stock[dept.id] < dept.max * 0.3 ? ` - low! grab a ${CRATES[dept.crate].name} crate` : '') };
  }
  if (o.type === 'tank') { if (tool === 'food') return { act: 'feed', o, label: ST.fedToday ? 'Fish are full' : 'Space: feed the tanks' }; return { label: ST.fedToday ? 'Live tanks (fed)' : 'Live tanks are hungry. Fish food is tool 4.' }; }
  if (o.type === 'bigcheese') return cheeseInfo(tool);
  if (o.anim) return animInfo(o, tool);
  if (o.type === 'desk') return { act: 'computer', label: 'Space: use the computer (catalog)' };
  if (o.type === 'couch') return { act: 'sleep', label: 'Space: sleep (ends the day)' };
  if (o.type === 'fridge') return { act: 'snack', label: ST.snacks >= 3 ? 'Snacks are gone for today' : 'Space: eat a snack (+energy)' };
  if (o.type === 'ringlight') return { act: 'film', label: ST.filmed ? 'Already posted today' : 'Space: film a TikTok (crowd boost)' };

}

function endDay() {

  // tasks
  ST.tasks.forEach(t => { if (t.id === 'cheese' && !t.fail) t.done = true; if (t.id === 'fest' && !t.fail) t.done = true; if (t.id === 'sales' && d.sales >= t.need) t.done = true; if (t.id === 'help' && d.helped >= t.need) t.done = true; });
  let bonus = 0; ST.tasks.forEach(t => { if (t.done) { bonus += 150; addRep(1); } }); ST.money += bonus; d.bonus = bonus;
  if (d.sales > ST.totals.best) ST.totals.best = d.sales; ST.salesGoal = Math.max(1500, Math.round(d.sales * 1.05 / 100) * 100);

}

  const u = UPG[id]; if (ST.ups[id] || ST.money < u.cost || stars() < u.stars || (u.req && !ST.ups[u.req])) return false;

  for (let i = 0; i < sub; i++) {

    updateLanes(dt); updateStaff(dt); updateCars(dt);
    if (RT.elvisT > 0) { RT.elvisT -= dt; if (Math.random() < dt * 4) RT.parts.push({ x: W.spots.elvis[0] * T + (Math.random() - 0.5) * 20, y: (W.spots.elvis[1] - 3) * T, vx: (Math.random() - 0.5) * 20, vy: -25, t: 1.4, note: true, c: pick(Math.random, ['#ffe14d', '#ff8fc0', '#9ff0ff']) }); }

  RT.floats = RT.floats.filter(f => { f.t -= dt; f.y -= 18 * dt; return f.t > 0; });

}
